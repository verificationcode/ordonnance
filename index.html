
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
        }

        .container {
            text-align: center;
        }

        .verification {
            font-size: 32px;
            font-weight: 600;
            color: #222222;
            margin-bottom: 18px;
        }

        .date {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 16px;
            color: #555555;
        }

        .check {
            width: 20px;
            height: 20px;
            background-color: #22a447;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 13px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="verification">
            Ordonnance vérifiée
        </div>

        <div class="date">
            <span class="check">✓</span>
            <span>02/12/2026</span>
        </div>
    </div>
</body>
</html>
